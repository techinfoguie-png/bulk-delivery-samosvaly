<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ-панель — СахалинСнаб</title>
  <link rel="stylesheet" href="styles/main.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    .tabs { display: flex; gap: 10px; margin: 20px 0; flex-wrap: wrap; }
    .tab { padding: 14px 24px; cursor: pointer; background: var(--card-bg); border: 1px solid #ccc; border-radius: 10px; font-weight: 600; }
    .tab.active { background: var(--primary); color: white; border-color: var(--primary); }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
    th { background: var(--primary); color: white; }
    .actions button { margin: 4px; padding: 6px 12px; font-size: 0.95rem; }
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); display: none; align-items: center; justify-content: center; z-index: 2000; }
    .modal-content { background: var(--card-bg); padding: 25px; border-radius: 16px; width: 90%; max-width: 620px; max-height: 90vh; overflow-y: auto; }
  </style>
</head>
<body>
  <nav class="main-nav">
    <div class="nav-container">
      <div class="logo">Админ-панель</div>
      <button onclick="logout()" style="background:none; border:none; color:white; font-size:1.1rem;">Выйти</button>
    </div>
  </nav>

  <div class="container">
    <div class="tabs">
      <div class="tab active" onclick="showTab(0)">📋 Заявки</div>
      <div class="tab" onclick="showTab(1)">🗃️ Материалы (CMS)</div>
    </div>

    <!-- ====================== Заявки ====================== -->
    <div id="tab-0">
      <div class="controls">
        <button onclick="loadOrders()">🔄 Обновить заявки</button>
        <button onclick="exportToExcel()">📊 Экспорт Excel</button>
        <button onclick="exportToCSV()">📋 Экспорт CSV</button>
      </div>
      <table id="orders-table">
        <thead>
          <tr>
            <th>Дата</th>
            <th>Имя</th>
            <th>Email</th>
            <th>Телефон</th>
            <th>Материал</th>
            <th>Объём</th>
            <th>Адрес</th>
            <th>Статус</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- ====================== CMS Материалы ====================== -->
    <div id="tab-1" style="display:none;">
      <div class="controls">
        <button onclick="loadMaterialsAdmin()">🔄 Загрузить материалы</button>
        <button onclick="showAddMaterialForm()">+ Добавить материал</button>
      </div>
      <table id="materials-table">
        <thead>
          <tr>
            <th>Название</th>
            <th>Цена ₽/м³</th>
            <th>Описание</th>
            <th>Изображение</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <!-- Модальное окно -->
  <div id="material-modal" class="modal">
    <div class="modal-content">
      <h2 id="modal-title">Добавить материал</h2>
      <input type="hidden" id="edit-index">
      <input type="text" id="m-name" placeholder="Название материала" required>
      <input type="number" id="m-price" placeholder="Цена за м³" step="0.01" required>
      <textarea id="m-desc" placeholder="Описание" rows="4"></textarea>
      <input type="text" id="m-image" placeholder="URL изображения">
      <div style="margin-top: 20px; text-align:right;">
        <button onclick="saveMaterial()">💾 Сохранить</button>
        <button onclick="closeModal()">Отмена</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxxcvSrUBRHS2VZW5dkeYOFkEl5Ox7WKXX7PfzQ6p1J3Bz8RHK0nBYV14nlqtU9nU0oxg/exec";
    const PASSWORD = "admin123"; // ← Измените обязательно!

    let allMaterials = [];

    function checkAuth() {
      if (localStorage.getItem('adminAuth') !== 'true') {
        const pass = prompt("Введите пароль администратора:");
        if (pass === PASSWORD) {
          localStorage.setItem('adminAuth', 'true');
        } else {
          alert("Неверный пароль!");
          window.location.href = "index.html";
        }
      }
    }

    function showTab(n) {
      document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === n));
      document.getElementById('tab-0').style.display = n === 0 ? 'block' : 'none';
      document.getElementById('tab-1').style.display = n === 1 ? 'block' : 'none';
    }

    // ====================== ЗАЯВКИ ======================
    async function loadOrders() {
      const res = await fetch(API_URL + "?action=getOrders");
      const orders = await res.json();
      const tbody = document.querySelector('#orders-table tbody');
      tbody.innerHTML = '';

      orders.forEach(order => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${new Date(order.дата).toLocaleString('ru-RU')}</td>
          <td>${order.имя || ''}</td>
          <td>${order.email || ''}</td>
          <td>${order.телефон || ''}</td>
          <td>${order.материал || ''}</td>
          <td>${order.объём_м3 || ''}</td>
          <td>${order.адрес || ''}</td>
          <td>
            <select onchange="changeStatus('${order.дата}', this.value)">
              <option value="Новый" ${order.статус === 'Новый' ? 'selected' : ''}>Новый</option>
              <option value="В обработке">В обработке</option>
              <option value="Назначен самосвал">Назначен самосвал</option>
              <option value="Доставлено">Доставлено</option>
              <option value="Отменено">Отменено</option>
            </select>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    async function changeStatus(timestamp, newStatus) {
      await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({action: 'updateStatus', timestamp, status: newStatus}),
        headers: {'Content-Type': 'application/json'}
      });
      alert(`Статус изменён на: ${newStatus}`);
    }

    // ====================== CMS ======================
    async function loadMaterialsAdmin() {
      const res = await fetch(API_URL);
      allMaterials = await res.json();
      const tbody = document.querySelector('#materials-table tbody');
      tbody.innerHTML = '';

      allMaterials.forEach((m, i) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${m.название}</td>
          <td>${parseFloat(m.цена_за_м3 || 0).toLocaleString('ru-RU')}</td>
          <td>${m.описание || ''}</td>
          <td>${m.изображение_url ? '✅' : '—'}</td>
          <td class="actions">
            <button onclick="editMaterial(${i})">✏️</button>
            <button onclick="deleteMaterial(${i})" style="color:red;">🗑️</button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    function showAddMaterialForm() {
      document.getElementById('modal-title').textContent = "Добавить материал";
      document.getElementById('edit-index').value = '';
      document.getElementById('m-name').value = '';
      document.getElementById('m-price').value = '';
      document.getElementById('m-desc').value = '';
      document.getElementById('m-image').value = '';
      document.getElementById('material-modal').style.display = 'flex';
    }

    function editMaterial(index) {
      const m = allMaterials[index];
      document.getElementById('modal-title').textContent = "Редактировать материал";
      document.getElementById('edit-index').value = index;
      document.getElementById('m-name').value = m.название || '';
      document.getElementById('m-price').value = m.цена_за_м3 || '';
      document.getElementById('m-desc').value = m.описание || '';
      document.getElementById('m-image').value = m.изображение_url || '';
      document.getElementById('material-modal').style.display = 'flex';
    }

    async function saveMaterial() {
      const name = document.getElementById('m-name').value.trim();
      const price = parseFloat(document.getElementById('m-price').value);
      const desc = document.getElementById('m-desc').value.trim();
      const image = document.getElementById('m-image').value.trim();
      const index = document.getElementById('edit-index').value;

      if (!name || isNaN(price)) return alert("Название и цена обязательны!");

      const payload = {
        название: name,
        цена_за_м3: price,
        описание: desc,
        изображение_url: image
      };

      if (index === '') {
        payload.action = 'addMaterial';
      } else {
        payload.action = 'updateMaterial';
        payload.rowIndex = allMaterials[index].rowIndex || index + 2;
      }

      await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify(payload),
        headers: {'Content-Type': 'application/json'}
      });

      alert("✅ Материал успешно сохранён!");
      closeModal();
      loadMaterialsAdmin();
    }

    async function deleteMaterial(index) {
      if (!confirm("Удалить материал?")) return;
      const rowIndex = allMaterials[index].rowIndex || index + 2;
      await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({action: 'deleteMaterial', rowIndex}),
        headers: {'Content-Type': 'application/json'}
      });
      alert("🗑️ Материал удалён");
      loadMaterialsAdmin();
    }

    function closeModal() {
      document.getElementById('material-modal').style.display = 'none';
    }

    function logout() {
      localStorage.removeItem('adminAuth');
      window.location.href = "index.html";
    }

    // Экспорт (упрощённый)
    function exportToExcel() { alert("Экспорт в Excel — будет добавлен в следующей итерации"); }
    function exportToCSV() { alert("Экспорт в CSV — будет добавлен в следующей итерации"); }

    // Запуск
    window.onload = () => {
      checkAuth();
      loadOrders();
    };
  </script>
</body>
</html>
