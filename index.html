<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Доставка сыпучих материалов — Южно-Сахалинск</title>
  <link rel="stylesheet" href="styles/main.css">
  
  <!-- Leaflet для карты -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
</head>
<body>
  <!-- ==================== НАВИГАЦИЯ ==================== -->
  <nav class="main-nav">
    <div class="nav-container">
      <div class="logo" onclick="navigateTo('/')">СахалинСнаб</div>
      
      <div class="menu">
        <a onclick="navigateTo('/')">Главная</a>
        <a onclick="navigateTo('/contacts')">Контакты и карта</a>
        <a onclick="navigateTo('/admin')">Админ-панель</a>
      </div>
      
      <div class="burger" onclick="toggleMobileMenu()">☰</div>
    </div>
    
    <!-- Мобильное меню -->
    <div class="mobile-menu" id="mobile-menu">
      <a onclick="navigateTo('/')">Главная</a>
      <a onclick="navigateTo('/contacts')">Контакты и карта</a>
      <a onclick="navigateTo('/admin')">Админ-панель</a>
    </div>
  </nav>

  <div id="app" class="content"></div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxxcvSrUBRHS2VZW5dkeYOFkEl5Ox7WKXX7PfzQ6p1J3Bz8RHK0nBYV14nlqtU9nU0oxg/exec";
    
    let currentMap = null;
    let currentRoute = null;
    const WAREHOUSE = [46.96, 142.73]; // Центр Южно-Сахалинска

    // ==================== КАРТА ====================
    function initMap() {
      if (currentMap) currentMap.remove();
      
      currentMap = L.map('map').setView(WAREHOUSE, 12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(currentMap);

      L.marker(WAREHOUSE).addTo(currentMap)
        .bindPopup('<b>Склад СахалинСнаб</b><br>Доставка самосвалами')
        .openPopup();
    }

    function calculateRoute(address) {
      if (!address) return;
      
      fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address + ", Южно-Сахалинск")}`)
        .then(r => r.json())
        .then(data => {
          if (data.length === 0) return alert("Адрес не найден. Попробуйте уточнить.");
          
          const dest = [parseFloat(data[0].lat), parseFloat(data[0].lon)];
          
          if (currentRoute) currentMap.removeControl(currentRoute);
          
          currentRoute = L.Routing.control({
            waypoints: [L.latLng(WAREHOUSE), L.latLng(dest)],
            routeWhileDragging: true,
            language: 'ru',
            showAlternatives: true,
            lineOptions: { styles: [{color: '#0066cc', weight: 7, opacity: 0.9}] }
          }).addTo(currentMap);

          document.getElementById('route-result').style.display = 'block';
        })
        .catch(() => alert("Ошибка построения маршрута"));
    }

    function calculateRouteFromInput() {
      const address = document.getElementById('address-input').value.trim();
      if (address) calculateRoute(address);
      else alert("Введите адрес доставки");
    }

    // ==================== SPA РОУТИНГ ====================
    const routes = {
      '/': 'home',
      '/contacts': 'contacts',
      '/admin': 'admin'
    };

    function toggleMobileMenu() {
      document.getElementById('mobile-menu').classList.toggle('show');
    }

    async function loadPage(page) {
      const app = document.getElementById('app');

      if (page === 'home') {
        document.getElementById('page-title').textContent = "Доставка сыпучих материалов — Южно-Сахалинск";
        
        app.innerHTML = `
          <header>
            <h1 id="company-name">Доставка сыпучих материалов</h1>
            <p id="main-text" class="subtitle"></p>
          </header>

          <section id="materials" class="materials-grid"></section>

          <section class="map-section">
            <div class="route-card">
              <h2>🛣️ Рассчитать маршрут доставки</h2>
              <div class="address-input-group">
                <input type="text" id="address-input" placeholder="Введите адрес (например: ул. Ленина 25)" />
              </div>
              <button class="btn-route" onclick="calculateRouteFromInput()">
                Построить маршрут от склада
              </button>
              <div id="route-result" class="result-info">✅ Маршрут построен. Можно двигать конечную точку.</div>
            </div>
            <div id="map"></div>
          </section>

          <section class="order-section">
            <h2>Оформить доставку</h2>
            <form id="order-form">
              <input type="text" name="name" placeholder="Ваше имя" required>
              <input type="email" name="email" placeholder="Ваш Email" required>
              <input type="tel" name="phone" placeholder="+7 (___) ___-__-__" required>
              <select name="material" id="material-select" required></select>
              <input type="number" name="volume" placeholder="Объём, м³" min="1" required>
              <input type="text" name="address" placeholder="Адрес доставки" required>
              <textarea name="comment" placeholder="Комментарий"></textarea>
              <button type="submit">Заказать доставку</button>
            </form>
          </section>
        `;

        loadSettings();
        loadMaterials();
        setTimeout(initMap, 400);

      } else if (page === 'contacts') {
        document.getElementById('page-title').textContent = "Контакты и карта — Южно-Сахалинск";
        app.innerHTML = `
          <div class="container" style="padding: 2rem 1rem;">
            <h1>Контакты и зона доставки</h1>
            <div id="map" style="height: 650px; margin-top: 20px;"></div>
          </div>
        `;
        setTimeout(initMap, 300);
      } else if (page === 'admin') {
        window.location.href = 'admin.html';
      }
    }

    function navigateTo(path) {
      history.pushState({}, '', path);
      loadPage(routes[path] || 'home');
      document.getElementById('mobile-menu').classList.remove('show');
    }

    window.onpopstate = () => {
      loadPage(routes[window.location.pathname] || 'home');
    };

    // ==================== ЗАГРУЗКА ДАННЫХ ====================
    async function loadSettings() {
      try {
        const res = await fetch(API_URL + '?action=getSettings');
        const settings = await res.json();
        document.getElementById('company-name').textContent = settings.company_name || 'Доставка сыпучих материалов';
        document.getElementById('main-text').textContent = settings.main_text || 'Быстрая доставка щебня, песка, ПГС самосвалами';
      } catch(e) {}
    }

    async function loadMaterials() {
      try {
        const res = await fetch(API_URL);
        const materials = await res.json();
        const container = document.getElementById('materials');
        const select = document.getElementById('material-select');
        
        container.innerHTML = '';
        select.innerHTML = '<option value="">Выберите материал</option>';

        materials.forEach(m => {
          const card = document.createElement('div');
          card.className = 'material-card';
          card.innerHTML = `
            <img src="${m.изображение_url || 'https://via.placeholder.com/300x200?text=' + m.название}" alt="${m.название}">
            <h3>${m.название}</h3>
            <p class="price">${parseFloat(m.цена_за_м3 || 0).toLocaleString('ru-RU')} ₽ / м³</p>
            <p>${m.описание || ''}</p>
            <button onclick="quickOrder('${m.название}')">Заказать</button>
          `;
          container.appendChild(card);

          const opt = document.createElement('option');
          opt.value = m.название;
          opt.textContent = `${m.название} — ${parseFloat(m.цена_за_м3 || 0).toLocaleString('ru-RU')} ₽`;
          select.appendChild(opt);
        });
      } catch(e) { console.error(e); }
    }

    function quickOrder(name) {
      document.querySelector('select[name="material"]').value = name;
      document.querySelector('.order-section').scrollIntoView({ behavior: 'smooth' });
    }

    // Отправка формы
    document.addEventListener('submit', async (e) => {
      if (e.target.id === 'order-form') {
        e.preventDefault();
        const formData = new FormData(e.target);
        const data = Object.fromEntries(formData);

        try {
          await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify(data),
            headers: { 'Content-Type': 'application/json' }
          });
          alert('✅ Заявка успешно отправлена! Мы свяжемся с вами в ближайшее время.');
          e.target.reset();
        } catch (err) {
          alert('Ошибка отправки. Попробуйте позже.');
        }
      }
    });

    // Запуск
    window.onload = () => loadPage('home');
  </script>
</body>
</html>
